name: Backend CI

on:
  push:
    paths:
      - 'server/todo-app/**'
  pull_request:
    paths:
      - 'server/todo-app/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # The runner image ships with MySQL 8 (root/root), stopped by default.
      # Using it avoids pulling mysql:8 from Docker Hub, which was timing out.
      - name: Start MySQL
        timeout-minutes: 2
        run: |
          sudo systemctl start mysql.service
          until mysqladmin ping -h 127.0.0.1 -u root -proot --silent; do sleep 1; done

      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize test database
        run: |
          mysql -h 127.0.0.1 -u root -proot < server/todo-app/sql/todo_test.sql
          mysql -h 127.0.0.1 -u root -proot -e "CREATE USER 'todo_test_user'@'%' IDENTIFIED BY 'testpassword123'; GRANT ALL PRIVILEGES ON todo_test.* TO 'todo_test_user'@'%'; FLUSH PRIVILEGES;"

      - name: Run tests
        working-directory: server/todo-app
        run: ./mvnw test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/todo_test
          DB_USERNAME: todo_test_user
          DB_PASSWORD: testpassword123
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server/todo-app
          platforms: linux/amd64
          push: true
          tags: 5imy/todo-app:latest
